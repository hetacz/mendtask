name: Build and Test

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 12 */2 * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Use secrets
        run: |
          echo "github.email=${GITHUB_EMAIL}" >> .env 
          echo "github.api.token=${GITHUB_API_TOKEN}" >> .env 
          echo "github.password=${GITHUB_PASSWORD}" >> .env
        env:
          GITHUB_EMAIL: ${{ secrets.github.email }}
          GITHUB_API_TOKEN: ${{ secrets.github.api.token }}
          GITHUB_PASSWORD: ${{ secrets.github.password }}
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build with Gradle
        run: ./gradlew build
      - name: Run tests
        run: ./gradlew test -P suiteFile=cicd.xml
      - name: Upload Build Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: build/
